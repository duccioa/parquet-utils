[project]
name = "parquet-utils"
version = "0.2.0"
description = "parx: a CLI to explore, convert and process parquet and geoparquet files"
authors = [{name = "Duccio Aiazzi", email = "duccioa@users.noreply.github.com"}]
dependencies = [
    "pandas>=3.0.5,<4",
    "geopandas>=1.1.4,<2",
    "click>=8.4.2,<9",
    "rich-click>=1.9.8,<2",
    "h3>=4.5.0,<5",
    "openpyxl>=3.1,<4",
    "jenkspy>=0.4,<1",
]
requires-python = ">= 3.11"

[project.scripts]
parx = "parquet_utils.cli:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
parquet_utils = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pyarrow = ">=25.0.0,<26"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
ty = "*"
pytest = "*"

[tool.pixi.feature.dev.tasks]
ruff = "ruff check src tests"
ty = "ty check src"
pytest = "pytest"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pytest.ini_options]
testpaths = ["tests"]
